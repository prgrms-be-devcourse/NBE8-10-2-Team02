services:
  app:
    image: ghcr.io/prgrms-be-devcourse/nbe8-10-2-team02:latest
    container_name: back-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://${DB_HOST}:5432/back
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET}
    ports:
      - "127.0.0.1:8080:8080"
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 512M
