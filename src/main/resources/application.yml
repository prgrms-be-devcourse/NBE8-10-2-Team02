spring:
  application:
    name: back
  profiles:
    active: dev
  output:
    ansi:
      enabled: always
  datasource:
    hikari:
      auto-commit: false
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
  jackson:
    serialization:
      fail-on-empty-beans: false
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 200             # jdbc배치활성화(200건씩 묶어서 전송)
        order_inserts: true           # INSERT를 엔티티 타입별로 정렬
        order_updates: true           # UPDATE도 동일
  security:
    debug: true
springdoc:
  default-produces-media-type: application/json;charset=UTF-8
logging:
  level:
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.orm.jdbc.extract: OFF
    org.springframework.transaction.interceptor: OFF
    com.back: DEBUG
    org.springframework.security: DEBUG
custom:
  jwt:
    secretKey: "${JWT_SECRET_KEY}"
  accessToken:
    expirationSeconds: "#{60*5}"
resilience4j:
  circuitbreaker:
    instances:
      igdb:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      steam:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      igdb:
        max-attempts: 4
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.back.global.exception.IgdbRetryableException
          - org.springframework.web.client.ResourceAccessException
      steam:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.back.global.steam.exception.SteamRetryableException
          - org.springframework.web.client.ResourceAccessException
  ratelimiter:
    instances:
      igdb:
        limit-for-period: 4
        limit-refresh-period: 1s
        timeout-duration: 5s
      steam:
        limit-for-period: 1
        limit-refresh-period: 1s
        timeout-duration: 10s
discord:
  webhook-url: "${DISCORD_WEBHOOK_URL:}"
igdb:
  base-url: "https://api.igdb.com/v4"
  client-id: "${IGDB_CLIENT_ID}"
  client-secret: "${IGDB_CLIENT_SECRET}"
  token-url: "https://id.twitch.tv/oauth2/token"
steam:
  base-url: "https://api.steampowered.com"
  api-key: "${STEAM_API_KEY}"
